<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Postcode88days</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
     integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
     crossorigin=""/>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="wrapper">
        <nav class="flex-column">
            <section class="fixed-menu flex-column">
                <!--<button aria-label="메뉴 열기">
                    <i class="icon-menu"></i>
                </button>-->
                <button class="brand" aria-label="Brand icon">brand-icon</button>
                <button class="search" aria-label="Search icon">search-icon</button>
                <button class="info" aria-label="Info icon">info-icon</button>
            </section>
            <hr>
            <section class="recently-searched flex-column"></section>
        </nav>
        <main class="flex-column">
            <div class="search-bar">
                <input type="search" aria-label="Search input" placeholder="Area name or Postcode">
                <button aria-label="Search button">Search</button>
            </div>
            <artilce class="searched-info flex-column">Searched Info</artilce>
            <footer class="ad-banner">Ad Banner</footer>
        </main>
        <div id="map"></div>
    </div>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
     integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
     crossorigin=""></script>
    <script src="script.js"></script>
</body>
</html>
